<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTransportAppWASM</title>
    <meta
      name="description"
      content="Real-time public transit tracking and weather-aware trip planning for Malaysia. Track buses, plan routes, and check weather forecasts."
    />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

    <!-- The splash is fully inlined below, so app styles can download without blocking FCP. -->
    <link rel="preload" as="style" href="css/app.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="MyTransportAppWASM.styles.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="css/app.css" />
      <link rel="stylesheet" href="MyTransportAppWASM.styles.css" />
    </noscript>

    <!-- Non-critical CSS loaded asynchronously -->
    <link rel="preload" as="style" href="css/bootstrap-subset.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="css/bootstrap-subset.css" /></noscript>

    <link rel="preload" as="style" href="css/icons.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="css/icons.css" /></noscript>

    <link rel="icon" type="image/svg+xml" href="myTransport.svg" />
    <link rel="preload" href="i18n/en-US.json" as="fetch" crossorigin="anonymous" />
    <link href="manifest.webmanifest" rel="manifest" />
    <meta
      name="theme-color"
      content="#FAF7F2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1E1E1C"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="myTransport.svg" />

    <style>
      /* Soft Neo-Brutalist & Warm Technical Editorial Splash Screen */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FAF7F2; /* warm cream paper */
        z-index: 9999;
      }
      .splash-logo {
        width: 112px;
        height: 112px;
        padding: 16px;
        background: #F2ECE1;
        border: 1.5px solid #1E1E1C;
        border-radius: 8px;
        box-shadow: 0 4px 0 #1E1E1C;
        animation: pulseLogo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .splash-text {
        margin-top: 24px;
        font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #1E1E1C;
        letter-spacing: 0.1em;
        padding: 6px 14px;
        background: #F5D5B8;
        border: 1.5px solid #1E1E1C;
        border-radius: 9999px;
        box-shadow: 0 2px 0 #1E1E1C;
        animation: fadeText 2s ease-in-out infinite alternate;
      }
      @keyframes pulseLogo {
        0%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
        50% {
          opacity: 0.92;
          transform: translateY(1px);
        }
      }
      @keyframes fadeText {
        0% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }
      /* Respect user's motion preference — disable infinite splash animations */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
        }
        .splash-text {
          animation: none;
          opacity: 1;
        }
      }
    </style>

    <!-- Bootstrap JS moved to <body> with defer to prevent render-blocking -->
  </head>

  <body>
    <script>
      // Pre-apply saved theme to avoid flash before Blazor and theme-manager load
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme-mode-global");
          if (!saved) {
            localStorage.setItem("theme-mode-global", "light");
          }
        } catch {}
        var isDark = saved === "dark"; // Default to Warm Technical Editorial light
        if (isDark) {
          document.body.classList.remove("theme-light");
          document.body.classList.add("theme-dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        } else {
          document.body.classList.add("theme-light");
          document.body.classList.remove("theme-dark");
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>
    <div id="app">
      <div id="app-splash">
        <img
          src="myTransport.svg"
          alt="MyTransport Logo"
          class="splash-logo"
          width="120"
          height="120"
          fetchpriority="high"
        />
        <div class="splash-text">Loading...</div>
      </div>
    </div>

    <div id="blazor-error-ui" role="alert">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <button class="dismiss" aria-label="Dismiss error">🗙</button>
    </div>
    <!-- Firebase manages popup completion and auth state natively, without a delayed opener reload. -->
    <!-- Populated by MSBuild OverrideHtmlAssetPlaceholders with fingerprinted .NET module mappings -->
    <script type="importmap"></script>
    <script src="js/theme-manager.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var register = function () {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
          };
          if ('requestIdleCallback' in window) {
            requestIdleCallback(register, { timeout: 2500 });
          } else {
            setTimeout(register, 1000);
          }
        }, { once: true });
      }
    </script>

    <!-- Dialog Helper and Fallback -->
    <script>
      window.dialogHelper = {
        showModal: function (id) {
          var el = document.getElementById(id);
          if (el && !el.open) el.showModal();
        },
        close: function (id) {
          var el = document.getElementById(id);
          if (el && el.open) el.close();
        },
      };

      window.navigationHelper = {
        collapseMobileMenu: function () {
          var toggler = document.querySelector(".navbar-toggler");
          if (toggler && toggler.checked) toggler.click();
        },
      };

      if (!("closedBy" in HTMLDialogElement.prototype)) {
        document.addEventListener("click", function (event) {
          var dialog = event.target.closest("dialog");
          if (dialog && dialog.getAttribute("closedby") === "any") {
            if (event.target !== dialog) return;
            var rect = dialog.getBoundingClientRect();
            var isDialogContent =
              rect.top <= event.clientY &&
              event.clientY <= rect.top + rect.height &&
              rect.left <= event.clientX &&
              event.clientX <= rect.left + rect.width;
            if (!isDialogContent) dialog.close();
          }
        });
      }
    </script>
  </body>
</html>

    <style>
      /* Glassmorphism Splash Screen */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        /* fallback dark */
        z-index: 9999;
      }

      .splash-logo {
        width: 120px;
        height: 120px;
        animation: pulseLogo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
      }

      .splash-text {
        margin-top: 24px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #f8fafc;
        letter-spacing: 0.05em;
        font-variant-numeric: tabular-nums;
        animation: fadeText 2s ease-in-out infinite alternate;
      }

      .splash-text::after {
        content: " " var(--blazor-load-percentage-text, "");
      }

      .splash-progress {
        width: min(240px, 70vw);
        height: 6px;
        margin-top: 16px;
        border-radius: 9999px;
        background: rgba(248, 250, 252, 0.16);
        overflow: hidden;
      }

      .splash-progress-bar {
        width: var(--blazor-load-percentage, 0%);
        height: 100%;
        border-radius: inherit;
        background: #38bdf8;
        transition: width 0.2s ease-out;
      }

      @keyframes pulseLogo {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }

        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
      }

      @keyframes fadeText {
        0% {
          opacity: 0.5;
        }

        100% {
          opacity: 1;
        }
      }

      /* Respect user's motion preference — disable infinite splash animations */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
        }

        .splash-text {
          animation: none;
          opacity: 1;
        }

        .splash-progress-bar {
          transition: none;
        }
      }
    </style>

    <script>
      // Pre-apply saved theme to avoid flash before Blazor and theme-manager load
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme-mode-global");
          if (!saved) {
            localStorage.setItem("theme-mode-global", "light");
          }
        } catch {}
        var isDark = saved === "dark"; // Default to Warm Technical Editorial light
        if (isDark) {
          document.body.classList.remove("theme-light");
          document.body.classList.add("theme-dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        } else {
          document.body.classList.add("theme-light");
          document.body.classList.remove("theme-dark");
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>

        function startBlazor() {
          Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
              if (
                (type !== "dotnetwasm" && type !== "assembly") ||
                typeof DecompressionStream !== "function" ||
                !window.wasmGzip ||

                (navigator.serviceWorker && navigator.serviceWorker.controller)
              ) {

              var fallbackFetch = function () {
                return fetch(
                  defaultUri,
                  integrity ? { integrity: integrity } : undefined,
                );
              };
              var gzUri = new URL(defaultUri, document.baseURI);
              gzUri.pathname += ".gz";
              return window.wasmGzip
                .fetchDecompressedWasm(gzUri.href, integrity)
                .then(function (decompressed) {
                  return decompressed || fallbackFetch();
                });
            },

    <!-- Dialog Helper and Fallback -->
    <script>
      window.dialogHelper = {
        showModal: function (id) {
          var el = document.getElementById(id);
          if (el && !el.open) el.showModal();
        },
        close: function (id) {
          var el = document.getElementById(id);
          if (el && el.open) el.close();
        },
      };

      window.navigationHelper = {
        collapseMobileMenu: function () {
          var toggler = document.querySelector(".navbar-toggler");
          if (toggler && toggler.checked) toggler.click();
        },
      };

      if (!("closedBy" in HTMLDialogElement.prototype)) {
        document.addEventListener("click", function (event) {
          var dialog = event.target.closest("dialog");
          if (dialog && dialog.getAttribute("closedby") === "any") {
            if (event.target !== dialog) return;
            var rect = dialog.getBoundingClientRect();
            var isDialogContent =
              rect.top <= event.clientY &&
              event.clientY <= rect.top + rect.height &&
              rect.left <= event.clientX &&
              event.clientX <= rect.left + rect.width;
            if (!isDialogContent) dialog.close();
          }
        });
      }
    </script>

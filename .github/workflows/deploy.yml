name: Deploy and Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Secrets into appsettings.json
        run: |
          API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}"
          sed -i "s/__GOOGLE_MAPS_API_KEY__/${API_KEY:-dummy_key}/g" MyTransportAppWASM/wwwroot/appsettings.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Configure Firebase web app
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON || '{"apiKey":"dummyApiKey","authDomain":"mytransportapp.firebaseapp.com","projectId":"mytransportapp","storageBucket":"mytransportapp.appspot.com","messagingSenderId":"123456789","appId":"1:123456789:web:abcdef"}' }}
        run: node scripts/configure-firebase.mjs

      - name: Install .NET WASM Build Tools
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore MyTransportApp.slnx

      - name: Run tests
        run: dotnet test MyTransportApp.slnx -c Release --no-restore --nologo

      - name: Run Firebase and service worker tests
        run: |
          node --experimental-vm-modules --test tests/firebase-config/*.test.mjs
          node --test tests/push/*.test.mjs
          node --test tests/service-worker/*.test.mjs

      - name: Run Google connection tests
        run: |
          node --experimental-vm-modules --test tests/google-services/*.test.mjs
          if command -v corepack >/dev/null 2>&1; then corepack enable; fi
          cd functions
          pnpm install --frozen-lockfile
          pnpm test

      - name: Setup Java for Firebase tests
        # The Firestore emulator requires Java 21 or later.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Firebase rule tests
        working-directory: tests/firebase
        run: |
          npm ci
          npm test

      - name: Setup agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Run browser smoke verification
        run: bash scripts/smoke-test.sh

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: Build and Publish
        run: dotnet publish MyTransportAppWASM/MyTransportAppWASM.csproj -c Release -o release --no-restore --nologo

      - name: Prepare for GitHub Pages
        run: |
          which rsync || ((command -v sudo >/dev/null 2>&1 && sudo apt-get update -qq && sudo apt-get install -y -qq rsync) || (apt-get update -qq && apt-get install -y -qq rsync))
          # Copy index.html to 404.html for SPA support
          cp release/wwwroot/index.html release/wwwroot/404.html
          # Add .nojekyll to bypass Jekyll
          touch release/wwwroot/.nojekyll

          # Optional: Add script to handle base href dynamically if needed
          sed -i 's/<base href="\/" \/>/<base href="\/MyTransportProject\/" \/>/g' release/wwwroot/index.html
          sed -i 's/<base href="\/" \/>/<base href="\/MyTransportProject\/" \/>/g' release/wwwroot/404.html
          sed -i 's/<base href="\/" \/>/<base href="\/MyTransportProject\/" \/>/g' release/wwwroot/privacy/index.html

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages

      - name: Package for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd release/wwwroot
          zip -r ../../MyTransportAppWASM-beta.zip .
          cd ../..

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: MyTransportAppWASM-beta.zip
          prerelease: true
          generate_release_notes: true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTransportAppWASM</title>
    <meta
      name="description"
      content="Real-time public transit tracking and weather-aware trip planning for Malaysia. Track buses, plan routes, and check weather forecasts."
    />
    <base href="/MyTransportProject/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- The splash is fully inlined below, so app styles can download without blocking FCP. -->
    <link rel="preload" as="style" href="css/base/variables.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/base/typography.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/card.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/button.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/form.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/badge.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/modal.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/stats.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/navigation.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="css/components/error.css" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="MyTransportAppWASM.styles.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="css/base/variables.css" />
      <link rel="stylesheet" href="css/base/typography.css" />
      <link rel="stylesheet" href="css/components/card.css" />
      <link rel="stylesheet" href="css/components/button.css" />
      <link rel="stylesheet" href="css/components/form.css" />
      <link rel="stylesheet" href="css/components/badge.css" />
      <link rel="stylesheet" href="css/components/modal.css" />
      <link rel="stylesheet" href="css/components/stats.css" />
      <link rel="stylesheet" href="css/components/navigation.css" />
      <link rel="stylesheet" href="css/components/error.css" />
      <link rel="stylesheet" href="MyTransportAppWASM.styles.css" />
    </noscript>

    <!-- Non-critical CSS loaded asynchronously -->
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
      onload="this.onload=null;this.rel='stylesheet'"
      onerror="this.onerror=null;this.removeAttribute('integrity');this.removeAttribute('crossorigin');this.href='lib/bootstrap/dist/css/bootstrap.min.css'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
      />
    </noscript>

    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" /></noscript>

    <link rel="icon" type="image/svg+xml" href="myTransport.svg" />
    <link rel="preload" href="myTransport.svg" as="image" fetchpriority="high" />
    <link rel="preload" href="i18n/en-US.json" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <!-- SVG icon fetched by browser via <link rel="icon"> and splash <img> — redundant preload added for LCP optimization -->
    <link href="manifest.webmanifest" rel="manifest" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="myTransport.svg" />

    <style>
      /* Glassmorphism Splash Screen */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 1); /* fallback dark */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 9999;
      }
      .splash-logo {
        width: 120px;
        height: 120px;
        animation: pulseLogo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
      }
      .splash-text {
        margin-top: 24px;
        font-family: "Outfit", sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: #f8fafc;
        letter-spacing: 0.05em;
        animation: fadeText 2s ease-in-out infinite alternate;
      }
      @keyframes pulseLogo {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(0.95);
        }
      }
      @keyframes fadeText {
        0% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
      /* Respect user's motion preference — disable infinite splash animations */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
        }
        .splash-text {
          animation: none;
          opacity: 1;
        }
      }
    </style>

    <!-- Bootstrap JS moved to <body> with defer to prevent render-blocking -->
  </head>

  <body>
    <script>
      // Pre-apply saved theme to avoid flash before Blazor and theme-manager load
      (function () {
        var saved = localStorage.getItem("theme-mode-global");
        var isDark = saved !== "light"; // Default to dark
        if (isDark) {
          document.body.classList.remove("theme-light");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        } else {
          document.body.classList.add("theme-light");
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>
    <div id="app">
      <div id="app-splash">
        <img
          src="myTransport.svg"
          alt="MyTransport Logo"
          class="splash-logo"
          width="120"
          height="120"
          fetchpriority="high"
        />
        <div class="splash-text">Loading...</div>
      </div>
    </div>

    <div id="blazor-error-ui" role="alert">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <button class="dismiss" aria-label="Dismiss error">🗙</button>
    </div>
    <script>
      // Firebase Auth state is managed natively by Firebase JS SDK
      window.appAuth = {
        explicitLogoutKey: "mytransport.explicitLogout",
        noteExplicitLogout: function () {
          sessionStorage.setItem(this.explicitLogoutKey, "true");
        },
        clearExplicitLogout: function () {
          sessionStorage.removeItem(this.explicitLogoutKey);
        },
        wasExplicitLogout: function () {
          return sessionStorage.getItem(this.explicitLogoutKey) === "true";
        }
      };
    </script>
    <!-- Empty importmap removed — no module specifier overrides needed -->
    <script src="js/theme-manager.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
      await Promise.allSettled([
        import("./js/firebase-auth.js"),
        import("./js/firebase-firestore.js"),
      ]);
      await Blazor.start();
    </script>

    <script src="js/auth.js" type="module"></script>
    <script>
      // Unregister any previously cached service workers to suppress stale no-op fetch handler warnings
      if ("serviceWorker" in navigator) {
        var appBaseUrl = new URL(document.baseURI).href;
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let reg of registrations) {
              if (reg.scope.startsWith(appBaseUrl)) {
                reg.unregister();
              }
            }
          });
      }
    </script>
    <!-- Dialog Helper and Fallback -->
    <script>
      window.dialogHelper = {
        showModal: function (id) {
          var el = document.getElementById(id);
          if (el && !el.open) el.showModal();
        },
        close: function (id) {
          var el = document.getElementById(id);
          if (el && el.open) el.close();
        },
      };

      window.navigationHelper = {
        collapseMobileMenu: function () {
          var toggler = document.querySelector(".navbar-toggler");
          if (toggler && toggler.checked) toggler.click();
        },
      };

      if (!("closedBy" in HTMLDialogElement.prototype)) {
        document.addEventListener("click", function (event) {
          var dialog = event.target.closest("dialog");
          if (dialog && dialog.getAttribute("closedby") === "any") {
            if (event.target !== dialog) return;
            var rect = dialog.getBoundingClientRect();
            var isDialogContent =
              rect.top <= event.clientY &&
              event.clientY <= rect.top + rect.height &&
              rect.left <= event.clientX &&
              event.clientX <= rect.left + rect.width;
            if (!isDialogContent) dialog.close();
          }
        });
      }
    </script>
  </body>
</html>
